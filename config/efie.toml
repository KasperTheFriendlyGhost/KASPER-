# KASPER V4 — Energy Fundamental Intelligence Engine (EFIE) research configuration.
#
# Every number here is an assumption you can and should check against your own
# statements and data. None of it is read by, or writes to, the live MCL Command Desk,
# the risk governor, HARD LOCK or any execution path: EFIE is research-only.

[instrument]
name = "MCL"                 # Micro WTI crude oil futures (NYMEX)
multiplier_bbl = 100         # barrels per contract
tick_size = 0.01             # USD/bbl
tick_value_usd = 1.00        # tick_size * multiplier

[costs]
# All-in per contract per side (broker commission + exchange + clearing + NFA).
# Replace with the figure on your own statements.
commission_per_side_usd = 1.25
slippage_ticks_per_side = 1.0  # assumed fill slippage, in ticks, each side
stress_multiplier = 2.0        # every backtest is also re-run at this multiple of costs

[sessions]
timezone = "America/New_York"
session_close_hour = 17        # CME Globex daily close, ET (the "next session" anchor)

[point_in_time]
# A release is treated as known this many minutes after its stated timestamp.
release_buffer_minutes = 5
# Daily series whose close time relative to 17:00 ET is uncertain are lagged one
# trading day before they can be used (Brent: ICE session ends after CME; TD3C freight
# futures settle on the Baltic assessment).
lag_one_day = ["BRN1", "TL1"]
# A freight observation older than this many calendar days is treated as missing.
max_staleness_days = 5

[validation]
# Walk-forward: expanding training window, refit every `refit_every` rows, with an
# embargo of `horizon` rows between the last training target and the first test row.
hourly_min_train = 2000        # ~4 months of hourly bars before the first forecast
hourly_refit_every = 250
daily_min_train = 750          # ~3 years of sessions before the first forecast
daily_refit_every = 63         # ~quarterly
logistic_C = 0.05              # fixed, pre-registered L2 strength (no tuning on test data)
ridge_alpha = 50.0
interval_nominal = 0.80        # prediction-interval coverage target
calibration_fraction = 0.25    # last share of each training window used for conformal calibration
bootstrap_reps = 2000
block_len_hourly = 24          # moving-block bootstrap block (rows)
block_len_daily = 10
seed = 20261020

[gate]
# A forecast is shown as a model forecast only when ALL hold out of sample;
# otherwise the report falls back to the unconditional (climatology) forecast.
min_oos_obs_hourly = 1500
min_oos_obs_daily = 500
min_bss_ci_low = 0.0           # Brier skill vs climatology: 95% CI lower bound must exceed this
max_calibration_gap = 0.02     # |mean forecast probability - observed up-frequency|
max_coverage_error = 0.05      # |empirical interval coverage - nominal|
min_r2_ci_low = 0.0            # expected-return model: 95% CI lower bound of OOS R^2

[backtest]
# Reference baselines are NOT your strategies; they exist so the overlay methodology
# can be exercised until your own MCL signal exports are supplied (see docs).
ema_fast = 20
ema_slow = 50
donchian_bars = 24
daily_momentum_days = 20
eia_standaside_bars_before = 1
eia_standaside_bars_after = 1
family_alpha = 0.05            # Holm–Bonferroni family-wise error rate for overlay tests
